
<!-- =============== HEADER PARTAGÉ =============== -->
<header class="absolute left-0 top-0 z-50 w-full">

  <nav class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-5 py-6 md:px-10">

    <!-- LOGO -->
    <a href="/" class="shrink-0 font-serif text-3xl font-semibold text-white">
      Auberge<span class="text-[#A8B6A4]">.</span>
    </a>

    <!-- MENU DESKTOP -->
    <div class="hidden items-center gap-6 text-sm font-medium text-white lg:flex">

      <!-- ACCUEIL -->
      <a href="/"
         class="transition hover:text-[#B8C5B5]">
        Accueil
      </a>

      <!-- CHAMBRES -->
      <a href="/chambres/"
         class="transition hover:text-[#B8C5B5]">
        Chambres
      </a>

      <!-- SERVICES -->
      <a href="/services/"
         class="transition hover:text-[#B8C5B5]">
        Services
      </a>

      <!-- À PROPOS -->
      <a href="/#apropos"
         class="transition hover:text-[#B8C5B5]">
        À propos
      </a>

      <!-- CONTACT -->
      <a href="/#contact"
         class="transition hover:text-[#B8C5B5]">
        Contact
      </a>

    </div>

    <!-- =============== ACTIONS =============== -->
    <div class="flex items-center gap-3">

      <!-- BOUTON CONNEXION -->
      <a href="/login/"
         class="hidden items-center justify-center gap-2
                rounded-full border border-[#E8DCC8]
                px-5 py-2.5 text-sm font-medium text-[#E8DCC8]
                transition duration-300
                hover:bg-[#E8DCC8] hover:text-[#202D28]
                sm:inline-flex">

        <svg xmlns="http://www.w3.org/2000/svg"
             width="17"
             height="17"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="1.8"
             stroke-linecap="round"
             stroke-linejoin="round">

          <path d="M10 17l5-5-5-5"/>
          <path d="M15 12H3"/>
          <path d="M12 3h6a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3h-6"/>

        </svg>

        Connexion
      </a>

      <!-- BOUTON RÉSERVER -->
      <a href="/reservations/"
         class="rounded-full bg-[#71816F]
                px-4 py-3 text-xs font-semibold text-white
                transition duration-300
                hover:bg-[#5B6D59] sm:px-6">

        Réserver <span class="ml-1">→</span>

      </a>

      <!-- BOUTON MENU MOBILE -->
      <button
        id="menu-btn"
        type="button"
        aria-label="Ouvrir le menu"
        aria-expanded="false"
        aria-controls="mobile-menu"
        class="rounded-md border border-white/40
               px-3 py-2 text-white lg:hidden">

        ☰

      </button>

    </div>

  </nav>

  <!-- =============== MENU MOBILE =============== -->
  <div id="mobile-menu"
       class="hidden bg-[#202D28] px-6 py-5 text-white lg:hidden">

    <!-- ACCUEIL -->
    <a href="/"
       class="block py-2 transition hover:text-[#B8C5B5]">
      Accueil
    </a>

    <!-- CHAMBRES -->
    <a href="/chambres/"
       class="block py-2 transition hover:text-[#B8C5B5]">
      Chambres
    </a>

    <!-- SERVICES -->
    <a href="/services/"
       class="block py-2 transition hover:text-[#B8C5B5]">
      Services
    </a>

    <!-- À PROPOS -->
    <a href="/#apropos"
       class="block py-2 transition hover:text-[#B8C5B5]">
      À propos
    </a>

    <!-- CONTACT -->
    <a href="/#contact"
       class="block py-2 transition hover:text-[#B8C5B5]">
      Contact
    </a>

    <!-- CONNEXION MOBILE -->
    <a href="/login/"
       class="mt-4 block rounded-full border border-[#E8DCC8]
              px-5 py-3 text-center text-sm font-semibold
              text-[#E8DCC8] transition
              hover:bg-[#E8DCC8] hover:text-[#202D28]">

      Connexion
    </a>

    <!-- RÉSERVER MOBILE -->
    <a href="/reservations/"
       class="mt-3 block rounded-full bg-[#71816F]
              px-5 py-3 text-center text-sm font-semibold
              text-white transition hover:bg-[#5B6D59]">

      Réserver →

    </a>

  </div>

</header>
