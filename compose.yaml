services:
  db:
    image: mysql:8.0
    container_name: auberge_db
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: auberge_web
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "9000:8000"
    volumes:
      - .:/app
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      CHARIPAY_API_KEY: ${CHARIPAY_API_KEY}
    depends_on:
      - db

volumes:
  mysql_data: