{% extends 'base.html' %}

{% block title %}Mot de passe oublié | Auberge{% endblock %}

{% block header_space %}
<div class="h-24 bg-[#202D28]"></div>
{% endblock %}

{% block content %}
<section class="min-h-[70vh] bg-[#F8F5EF] px-6 py-20">
    <div class="mx-auto max-w-md">

        <h1 class="mb-4 text-center font-serif text-4xl text-[#302B26]">
            Mot de passe oublié ?
        </h1>

        <p class="mb-8 text-center text-sm text-[#77736D]">
            Saisissez votre adresse e-mail pour recevoir
            un code de vérification.
        </p>

        <form method="post" class="space-y-5">
            {% csrf_token %}

            <input
                type="email"
                name="email"
                placeholder="Votre adresse e-mail"
                autocomplete="email"
                required
                class="w-full rounded-lg border border-[#DDD8CF]
                       bg-white px-4 py-3 outline-none
                       focus:border-[#455B45]">

            <button
                type="submit"
                class="w-full rounded-lg bg-[#455B45]
                       px-6 py-4 font-semibold text-white
                       hover:bg-[#304330]">
                Envoyer le code
            </button>
        </form>

        <p class="mt-6 text-center">
            <a href="{% url 'login' %}"
               class="text-sm text-[#455B45] hover:underline">
                Retour à la connexion
            </a>
        </p>
    </div>
</section>
{% endblock %}
